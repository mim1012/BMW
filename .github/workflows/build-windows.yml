name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-windows.yml"
      - "build_win.bat"
      - "BMW-AutoBuyer.spec"
      - "gui_app.py"
      - "requirements.txt"
      - "scanned_models.json"
      - "form_fields*.json"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build BMW-AutoBuyer.exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: |
          python -m PyInstaller BMW-AutoBuyer.spec --noconfirm --clean

      - name: Package artifact
        run: |
          Compress-Archive -Path dist\BMW-AutoBuyer.exe -DestinationPath BMW-AutoBuyer-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMW-AutoBuyer-Windows
          path: BMW-AutoBuyer-Windows.zip
          if-no-files-found: error
          retention-days: 14
